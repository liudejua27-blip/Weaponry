# Future compatibility baseline for the Codex IDE extension. It uses the same
# single-user forgecad-mcp entrypoint; this file is not a current P0 Gate.
[mcp_servers.forgecad]
command = "forgecad-mcp"
args = ["serve", "--stdio"]
env_vars = ["FORGECAD_MCP_ENABLE_MCP004_WRITES"]
enabled = true
startup_timeout_sec = 20
tool_timeout_sec = 60
required = false
default_tools_approval_mode = "writes"
