# Codex CLI baseline for the single-user ForgeCAD MVP. No secret values or
# machine paths are checked in; forgecad-mcp starts the local Runtime child.
[mcp_servers.forgecad]
command = "forgecad-mcp"
args = ["serve", "--stdio"]
env_vars = ["FORGECAD_MCP_ENABLE_MCP004_WRITES"]
enabled = true
startup_timeout_sec = 20
tool_timeout_sec = 180
required = false
default_tools_approval_mode = "writes"
