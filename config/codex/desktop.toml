# Codex Desktop baseline for the single-user ForgeCAD MVP.
# forgecad-mcp owns stdio and starts one local Runtime child asynchronously.
[mcp_servers.forgecad]
command = "forgecad-mcp"
args = ["serve", "--stdio"]
env_vars = ["FORGECAD_MCP_ENABLE_MCP004_WRITES"]
enabled = true
startup_timeout_sec = 20
tool_timeout_sec = 60
required = false
default_tools_approval_mode = "writes"
