[package]
name = "forgecad-geometry-worker"
version = "0.1.0"
edition = "2021"

[build-dependencies]
cc = "1.2"

[dependencies]
base64 = "0.22"
forgecad-core = { path = "../desktop/src-tauri/crates/forgecad-core" }
forgecad-worker-protocol = { path = "../desktop/src-tauri/crates/forgecad-worker-protocol" }
image = { version = "0.25.10", default-features = false, features = ["png"] }
libc = "0.2"
mikktspace = "=0.3.0"
