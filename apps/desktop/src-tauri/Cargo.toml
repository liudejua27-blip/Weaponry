[package]
name = "forgecad-desktop"
version = "0.1.0"
description = "ForgeCAD Codex MCP Runtime desktop viewer"
authors = ["ForgeCAD Contributors"]
edition = "2021"
default-run = "forgecad-desktop"

[workspace]
members = [
  ".",
  "crates/forgecad-contracts",
  "crates/forgecad-core",
  "crates/forgecad-store",
  "crates/forgecad-runtime",
  "crates/forgecad-mcp",
  "crates/forgecad-worker-protocol",
]
default-members = [
  ".",
  "crates/forgecad-contracts",
  "crates/forgecad-core",
  "crates/forgecad-store",
  "crates/forgecad-runtime",
  "crates/forgecad-mcp",
  "crates/forgecad-worker-protocol",
]
resolver = "2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
forgecad-runtime = { path = "crates/forgecad-runtime" }
serde_json = "1"
tauri = { version = "2", features = [] }

[features]
custom-protocol = ["tauri/custom-protocol"]
# Explicit test-only wiring for the isolated Viewer IPC fixture. Production
# builds leave these disabled; the fixture must never silently replace sibling
# Worker transport when a normal package is compiled.
test-render-worker-fallback = ["forgecad-runtime/test-render-worker-fallback"]
test-geometry-worker-fallback = ["forgecad-runtime/test-geometry-worker-fallback"]
