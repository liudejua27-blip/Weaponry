[package]
name = "forgecad-runtime"
version = "0.1.0"
edition = "2021"

[features]
# Internal test wiring only. Production builds leave both features disabled,
# so Runtime can execute geometry and rendering only through fixed sibling
# Workers. Render fallback is separate so a normal test target cannot silently
# replace the Render Worker boundary merely because cfg(test) is active.
test-render-worker-fallback = ["dep:forgecad-render-core"]
test-geometry-worker-fallback = ["dep:forgecad-geometry-worker", "test-render-worker-fallback"]

[dependencies]
base64 = "0.22"
forgecad-core = { path = "../forgecad-core" }
forgecad-contracts = { path = "../forgecad-contracts" }
forgecad-blender-worker = { path = "../../../../blender-worker" }
forgecad-geometry-worker = { path = "../../../../../apps/geometry-worker", optional = true }
forgecad-render-core = { path = "../../../../../apps/render-core", optional = true }
forgecad-store = { path = "../forgecad-store" }
forgecad-worker-protocol = { path = "../forgecad-worker-protocol" }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
forgecad-geometry-worker = { path = "../../../../../apps/geometry-worker" }
forgecad-render-core = { path = "../../../../../apps/render-core" }

[build-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
