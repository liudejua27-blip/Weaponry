[package]
name = "forgecad-runtime"
version = "0.1.0"
edition = "2021"

[dependencies]
forgecad-core = { path = "../forgecad-core" }
forgecad-contracts = { path = "../forgecad-contracts" }
forgecad-store = { path = "../forgecad-store" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
