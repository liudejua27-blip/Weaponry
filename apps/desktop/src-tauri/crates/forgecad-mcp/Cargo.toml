[package]
name = "forgecad-mcp"
version = "0.1.0"
edition = "2021"

[features]
# Weaponry's knife profile is the default public surface.  The historical
# 226-operation manifest is intentionally opt-in so release/default builds do
# not compile or link the compatibility registry.
default = []
legacy-compatibility-registry = []

[[bin]]
name = "forgecad-mcp"
path = "src/main.rs"

[[bin]]
name = "forgecad-mcp-compat"
path = "src/compat_main.rs"
required-features = ["legacy-compatibility-registry"]

[dependencies]
forgecad-contracts = { path = "../forgecad-contracts" }
forgecad-runtime = { path = "../forgecad-runtime" }
libc = "0.2"
serde_json = "1"

[dev-dependencies]
# `forgecad-runtime` is a normal dependency of the MCP binary.  The
# integration-style unit test below runs it as a dependency, so `cfg(test)` is
# not set inside Runtime.  Enable its explicitly test-only fallback only for
# this test target; release MCP builds still require the fixed sibling Worker.
forgecad-runtime = { path = "../forgecad-runtime", features = ["test-geometry-worker-fallback"] }
