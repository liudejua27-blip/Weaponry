adaptation_result:
  - keep ordered modifier data separate from evaluated geometry
  - keep immutable action and rest-frame identities separate from evaluated frame identities
  - keep Viewer playhead ephemeral and Runtime evaluation authoritative
  - bind every projected rigid Part delta to exact candidate, artifact, clip, scheduled tick, Worker cohort and transient artifact hash
  - express nearest-surface and project-along-normal Cage diagnostics as product-owned typed Rust kernels rather than copying Shrinkwrap implementation
  - express High-to-Low correspondence, selected-to-active ray policy, Cage distance and UV margin as closed ForgeCAD contracts with independent replay
  - keep Blender mesh remap and bake implementation details out of the product while reusing their problem decomposition as clean-room test requirements
