name: ForgeCAD Runtime Security

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 scripts/check_release_secrets_files.py
      - run: python3 scripts/check_release_safety_scope.py
      - run: python3 scripts/check_repository_integrity.py
      - run: python3 scripts/check_release_license_sbom.py
