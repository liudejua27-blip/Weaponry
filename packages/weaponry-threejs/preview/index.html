<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weaponry Three.js Knife Preview</title>
    <style>
      html, body, #app { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #080b10; }
      #app { display: flex; align-items: center; justify-content: center; padding: 0; box-sizing: border-box; }
      body { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color: #d8dee9; }
      canvas { display: block; width: min(100%, 100vh); height: auto; max-width: 100%; max-height: 100%; object-fit: contain; image-rendering: auto; }
      .label { position: fixed; left: 24px; top: 20px; z-index: 2; font-size: 13px; letter-spacing: .05em; }
      .label strong { display: block; color: #fff; font-size: 16px; margin-bottom: 6px; }
      .label span { color: #8f9baa; }
    </style>
  </head>
  <body>
    <div class="label"><strong>Dragonfang / fixed-view knife preview</strong><span id="status">loading fixed view · quality NOT_RUN</span></div>
    <div id="app"></div>
    <output id="weaponry-preview-receipt" hidden aria-hidden="true"></output>
    <output id="weaponry-capture-bundle" hidden aria-hidden="true"></output>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
